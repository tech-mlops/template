# Pipeline Configuration
pipeline:
  name: "example-pipeline"
  description: "Example CI/CD pipeline configuration"
  version: "1.0.0"

# Build Configuration
build:
  image: "node:20-alpine"
  working_directory: "/app"
  commands:
    - "npm ci"
    - "npm run build"
    - "npm test"

# Deployment Configuration
deployment:
  environment: "production"
  strategy: "rolling"
  replicas: 3
  container:
    name: "example-app"
    image: "example-app:latest"
    port: 8080
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

# Service Configuration
service:
  name: "example-service"
  type: "ClusterIP"
  port: 80
  targetPort: 8080

# Environment Variables
environment:
  - name: "NODE_ENV"
    value: "production"
  - name: "LOG_LEVEL"
    value: "info"
  - name: "API_VERSION"
    value: "v1"

# Health Check
healthCheck:
  path: "/health"
  port: 8080
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

# Notifications
notifications:
  slack:
    enabled: true
    channel: "#deployments"
  email:
    enabled: false
